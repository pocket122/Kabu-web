<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>モーゲージ 為替シミュレーター</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f7f9;color:#222}
main{max-width:900px;margin:auto;padding:24px 16px 48px}h1{font-size:24px;margin:0 0 8px}p{color:#666}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px;margin:14px 0}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 5px}input{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:16px}
.result{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.box{background:#f3f5f7;border-radius:10px;padding:14px}.box b{display:block;font-size:20px;margin-top:5px}
.note{font-size:13px;color:#777}.positive{color:#087f3e}.negative{color:#b42318}
table{width:100%;border-collapse:collapse;margin-top:10px}th,td{padding:9px;border-bottom:1px solid #eee;text-align:right}th:first-child,td:first-child{text-align:center}
@media(max-width:650px){.grid,.result{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>モーゲージ・為替シミュレーター</h1>
<p>ドル建てモーゲージを想定し、金利・為替・手数料を含めて円換算の資産額を試算します。</p>

<div class="card">
<h2>前提条件</h2>
<div class="grid">
<div>
<label>毎月積立額（円）</label><input id="monthly" type="number" value="30000" min="0">
<label>運用期間（年）</label><input id="years" type="number" value="10" min="1" max="60">
<label>モーゲージ月利（%）</label><input id="rate" type="number" value="0.5" step="0.01">
<label>初期手数料（円・返金なし）</label><input id="initial" type="number" value="1000000" min="0">
</div>
<div>
<label>開始時 USD/JPY</label><input id="fx0" type="number" value="150" step="0.1" min="1">
<label>終了時 USD/JPY</label><input id="fx1" type="number" value="150" step="0.1" min="1">
<label>入金手数料（%）</label><input id="depositFee" type="number" value="1" step="0.1" min="0">
<label>出金手数料（%）</label><input id="withdrawFee" type="number" value="1" step="0.1" min="0">
</div>
</div>
<p class="note">月利0.5%は複利で年率約6.17%。為替は「1ドル＝何円」で入力します。終了時の円換算では、円高（USD/JPY低下）になるほど不利になります。</p>
</div>

<div class="card">
<h2>結果</h2>
<div class="result">
<div class="box">投入元本<b id="principal">-</b></div>
<div class="box">最終評価額（円）<b id="final">-</b></div>
<div class="box">損益<b id="profit">-</b></div>
</div>
<p id="fxText"></p>
</div>

<div class="card">
<h2>年ごとの推移</h2>
<table><thead><tr><th>年</th><th>累計投入</th><th>ドル残高</th><th>円換算</th></tr></thead><tbody id="rows"></tbody></table>
</div>
</main>
<script>
const ids=["monthly","years","rate","initial","fx0","fx1","depositFee","withdrawFee"];
ids.forEach(id=>document.getElementById(id).addEventListener("input",calc));
function yen(n){return Math.round(n).toLocaleString("ja-JP")+"円"}
function calc(){
 const monthly=Math.max(0,+document.getElementById("monthly").value||0);
 const years=Math.min(60,Math.max(1,+document.getElementById("years").value||1));
 const monthlyRate=(+document.getElementById("rate").value||0)/100;
 const initial=Math.max(0,+document.getElementById("initial").value||0);
 const fx0=Math.max(1,+document.getElementById("fx0").value||150);
 const fx1=Math.max(1,+document.getElementById("fx1").value||150);
 const df=Math.max(0,+document.getElementById("depositFee").value||0)/100;
 const wf=Math.max(0,+document.getElementById("withdrawFee").value||0)/100;
 let usd=0,rows="";
 for(let y=1;y<=years;y++){
   for(let m=0;m<12;m++) usd=(usd+monthly/fx0*(1-df))*(1+monthlyRate);
   const fx=fx0+(fx1-fx0)*(y/years);
   const yenValue=usd*fx*(1-wf)-initial;
   rows+=`<tr><td>${y}</td><td>${yen(monthly*12*y)}</td><td>${usd.toFixed(2)} USD</td><td>${yen(yenValue)}</td></tr>`;
 }
 const principal=monthly*12*years+initial;
 const finalValue=usd*fx1*(1-wf)-initial;
 const profit=finalValue-principal;
 document.getElementById("principal").textContent=yen(principal);
 document.getElementById("final").textContent=yen(finalValue);
 const p=document.getElementById("profit");p.textContent=(profit>=0?"+":"")+yen(profit);p.className=profit>=0?"positive":"negative";
 document.getElementById("fxText").textContent=`為替：${fx0.toFixed(1)}円 → ${fx1.toFixed(1)}円（${((fx1/fx0-1)*100).toFixed(1)}%変動）`;
 document.getElementById("rows").innerHTML=rows;
}
calc();
</script>
</body>
</html>
