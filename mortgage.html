<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>モーゲージ vs ドル預金 vs オルカン</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1000px;margin:auto;padding:24px 16px 48px}h1{font-size:25px;margin:0 0 8px}h2{font-size:18px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.field{margin:9px 0}label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}input{width:100%;padding:9px;border:1px solid #ccc;border-radius:8px;font-size:15px}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.r{padding:14px;border-radius:10px;background:#f2f4f6}.r strong{display:block;font-size:20px;margin-top:5px}.small{font-size:12px;color:#777}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px;border-bottom:1px solid #eee;text-align:right}th:first-child,td:first-child{text-align:center}@media(max-width:700px){.grid,.results{grid-template-columns:1fr}main{padding:18px 12px}}
</style></head><body><main>
<h1>モーゲージ vs ドル預金 vs オルカン</h1>
<p>3つを同じ積立額・期間で比較。ドル建て商品は為替変動も円換算に反映します。</p>
<div class="card"><h2>共通条件</h2><div class="grid">
<div class="field"><label>毎月積立額（円）</label><input id="monthly" type="number" value="30000" min="0"></div>
<div class="field"><label>期間（年）</label><input id="years" type="number" value="10" min="1" max="60"></div>
<div class="field"><label>開始時 USD/JPY</label><input id="fx0" type="number" value="150" min="1" step=".1"></div>
</div><div class="grid">
<div class="field"><label>終了時 USD/JPY</label><input id="fx1" type="number" value="150" min="1" step=".1"></div>
<div class="field"><label>入金手数料（%）※ドル系</label><input id="df" type="number" value="1" min="0" step=".1"></div>
<div class="field"><label>出金手数料（%）※ドル系</label><input id="wf" type="number" value="1" min="0" step=".1"></div>
</div></div>
<div class="card"><h2>モーゲージ</h2><div class="grid">
<div class="field"><label>月利（%）</label><input id="mr" type="number" value=".5" step=".01"></div>
<div class="field"><label>初期手数料（円）</label><input id="mi" type="number" value="1000000" min="0"></div>
<div class="field"><label>計算</label><div class="small">月次複利。初期手数料は最終額から控除</div></div>
</div></div>
<div class="card"><h2>ドル預金</h2><div class="grid">
<div class="field"><label>年利（%）</label><input id="dr" type="number" value="3" step=".1"></div>
<div class="field"><label>税率（%）</label><input id="tax" type="number" value="20.315" step=".001"></div>
<div class="field"><label>利息</label><div class="small">税引後の年利で複利計算</div></div>
</div></div>
<div class="card"><h2>オルカン</h2><div class="grid">
<div class="field"><label>想定年利（%）</label><input id="ar" type="number" value="6" step=".1"></div>
<div class="field"><label>信託報酬等（%）</label><input id="af" type="number" value=".0575" step=".001"></div>
<div class="field"><label>為替</label><div class="small">海外資産部分の為替影響を簡易的に反映</div></div>
</div></div>
<div class="card"><h2>最終結果</h2><div class="results">
<div class="r">モーゲージ<strong id="mout">-</strong></div><div class="r">ドル預金<strong id="dout">-</strong></div><div class="r">オルカン<strong id="aout">-</strong></div>
</div><p id="fx"></p><p class="small">※比較用のシミュレーションです。実際の商品条件、税制、為替スプレッド、為替の推移等とは異なる場合があります。</p></div>
<div class="card"><h2>年ごとの推移</h2><table><thead><tr><th>年</th><th>モーゲージ</th><th>ドル預金</th><th>オルカン</th></tr></thead><tbody id="rows"></tbody></table></div>
</main>
<script>
const ids=["monthly","years","fx0","fx1","df","wf","mr","mi","dr","tax","ar","af"];ids.forEach(id=>document.getElementById(id).addEventListener("input",calc));
const money=n=>Math.round(n).toLocaleString("ja-JP")+"円";
function calc(){
 const g=id=>+document.getElementById(id).value||0,monthly=Math.max(0,g("monthly")),years=Math.min(60,Math.max(1,g("years")));
 const fx0=Math.max(1,g("fx0")),fx1=Math.max(1,g("fx1")),df=Math.max(0,g("df"))/100,wf=Math.max(0,g("wf"))/100;
 const mm=g("mr")/100,mi=Math.max(0,g("mi")),dAnnual=Math.max(-99,g("dr"))/100*(1-g("tax")/100),aAnnual=(g("ar")-g("af"))/100;
 let m=0,usd=0,a=0,rows="";
 for(let y=1;y<=years;y++){
  for(let mo=0;mo<12;mo++){m=(m+monthly)*(1+mm);usd=(usd+monthly/fx0*(1-df))*(1+dAnnual/12);a=(a+monthly)*(1+aAnnual/12);}
  const fx=fx0+(fx1-fx0)*y/years,mv=m*(1-wf)-mi,dv=usd*fx*(1-wf),av=a;
  rows+=`<tr><td>${y}</td><td>${money(mv)}</td><td>${money(dv)}</td><td>${money(av)}</td></tr>`;
 }
 const mf=m*(1-wf)-mi,dfinal=usd*fx1*(1-wf),afinal=a;
 document.getElementById("mout").textContent=money(mf);document.getElementById("dout").textContent=money(dfinal);document.getElementById("aout").textContent=money(afinal);
 document.getElementById("fx").textContent=`為替：${fx0.toFixed(1)}円 → ${fx1.toFixed(1)}円（${((fx1/fx0-1)*100).toFixed(1)}%）`;
 document.getElementById("rows").innerHTML=rows;
}
calc();
</script></body></html>
